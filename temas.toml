# Pranchas do atlas. Cada tema tem:
#   id          identificador curto (nome dos arquivos de dados, consulta e prancha)
#   numero      ordem da prancha
#   titulo      título da prancha
#   situacao    planejado | em-andamento | publicado
#   consulta    arquivo em consultas/ (Overpass QL; {{bbox}} é substituído pela caixa do município)
#   referencia  base oficial em dados/oficiais/ usada na completude, ou "interno"
#   recorte     municipio | sede | ambos (mapas gerados para a prancha)
# Uma prancha em situação diferente de "planejado" precisa de atlas/pranchas/<numero>-<id>.qmd.

[[tema]]
id = "localizacao"
numero = 1
titulo = "Localização e limites"
situacao = "em-andamento"
consulta = "localizacao.overpassql"
referencia = "interno"
recorte = "municipio"

