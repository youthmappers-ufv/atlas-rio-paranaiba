# Configuração do Atlas Colaborativo de Rio Paranaíba (MG).
# Criado em 2026-10-21 por atlas-motor/scripts/novo_local.py. Mudanças aqui passam por pull request.

[municipio]
nome = "Rio Paranaíba"
uf = "MG"
ibge = "3155504"
osm_relacao = 314621          # limite municipal no OpenStreetMap (admin_level=8)
wikidata = "Q22065225"
# Caixas envolventes: [sul, oeste, norte, leste], em graus (WGS 84)
bbox = [-19.4475, -46.5405, -19.0445, -46.0812]
sede_bbox = [-19.2115, -46.2600, -19.1815, -46.2265]         # recorte dos mapas da sede; ajuste se precisar

[motor]
# Versão do atlas-motor usada por este município. Para atualizar:
#   python ../atlas-motor/scripts/atualizar_motor.py --versao vX.Y.Z
# (troca aqui e nos workflows; o validador confere que batem).
versao = "v0.6.0"

[hashtags]
# Toda edição no OSM feita para o atlas leva as duas, sempre juntas.
programa = "#youthmappersufv"
projeto = "#ymufv-atlas"

[overpass]
servidores = [
  "https://overpass-api.de/api/interpreter",
  "https://overpass.openstreetmap.fr/api/interpreter",
  "https://overpass.private.coffee/api/interpreter",
]
tempo_limite = 240

[completude]
distancia_max_m = 150
similaridade_min = 0.6

[publicacao]
# Onde o atlas é publicado:
#   "pages"    = GitHub Pages deste repositório (que deve ser público), branch gh-pages;
#   "artefato" = só artefato do workflow (e release, em tags), para baixar e hospedar onde quiser
#                ou para repositório privado (ex.: município sem parceria).
hospedagem = "pages"
url = "https://youthmappers-ufv.github.io/atlas-rio-paranaiba/"   # endereço do site
dominio = ""                                          # opcional: domínio próprio (ex.: "atlas.prefeitura.mg.gov.br")
slug = "rio-paranaiba"                                     # nome do PDF: atlas-<slug>.pdf
atribuicao = "© colaboradores do OpenStreetMap (ODbL)"
autoria = "Programa Youthmappers UFV"
instituicao = "Universidade Federal de Viçosa — Campus Rio Paranaíba"
registro = "RAEX PRJ-211/2026"
