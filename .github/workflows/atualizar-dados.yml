# Retrato mensal do OpenStreetMap, proposto por pull request (dia 1 de cada mês ou manual).
# Requer em Settings > Actions > General: "Allow GitHub Actions to create and approve pull requests".
name: Atualizar dados do OSM

on:
  schedule:
    - cron: "25 8 1 * *"      # dia 1; horário próprio do município (atlas-motor v0.2.1)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  atualizar:
    uses: youthmappers-ufv/atlas-motor/.github/workflows/atualizar-dados.yml@v0.12.0
