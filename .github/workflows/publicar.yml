# Gera o site e o PDF do atlas e publica no repositório público de saída
# (youthmappers-ufv/atlas, GitHub Pages em https://youthmappers-ufv.github.io/atlas/).
#
# Quando roda:
#  - tag v* (ex.: v1.0): edição numerada. Publica em /edicoes/<tag>/ e como versão
#    principal, e cria um release (privado) com o PDF neste repositório;
#  - todo dia 5, às 6h (Brasília): versão principal a partir da main, com os dados versionados;
#  - botão "Run workflow": escolha a versão (branch, tag ou commit), se baixa os dados
#    atuais do OSM na hora e o destino (principal ou edição).
#
# Requer o segredo ATLAS_CHAVE_PUBLICACAO: chave SSH privada cuja chave pública está em
# youthmappers-ufv/atlas > Settings > Deploy keys, com permissão de escrita
# (docs/configuracao-github.md).
name: Publicar atlas

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 9 5 * *"
  workflow_dispatch:
    inputs:
      versao:
        description: "Branch, tag ou commit a publicar"
        default: main
        required: true
      dados_atuais:
        description: "Baixar os dados atuais do OSM na hora (em vez dos versionados)"
        type: boolean
        default: false
      destino:
        description: "Onde publicar"
        type: choice
        options: [principal, edicao]
        default: principal

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Definir versão e destino
        id: alvo
        env:
          EVENTO: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          VERSAO: ${{ inputs.versao }}
          DESTINO: ${{ inputs.destino }}
          BAIXAR: ${{ inputs.dados_atuais }}
        run: |
          case "$EVENTO" in
            push)     ref="$TAG";    destino="edicao";    baixar="false" ;;
            schedule) ref="main";    destino="principal"; baixar="false" ;;
            *)        ref="$VERSAO"; destino="$DESTINO";  baixar="$BAIXAR" ;;
          esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "destino=$destino" >> "$GITHUB_OUTPUT"
          echo "baixar=$baixar" >> "$GITHUB_OUTPUT"
          echo "pasta=$(echo "$ref" | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.alvo.outputs.ref }}
          fetch-depth: 0               # para o git describe (versão mostrada no atlas)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Testes
        run: python -m unittest discover -s testes

      - name: Construir (indicadores, mapas, trechos)
        env:
          ATLAS_VERSAO: ${{ steps.alvo.outputs.ref }}
        run: |
          if [ "${{ steps.alvo.outputs.baixar }}" = "true" ]; then
            python scripts/construir.py --baixar
          else
            python scripts/construir.py
          fi

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Renderizar site e PDF
        run: quarto render atlas

      - name: Nome do PDF
        id: pdf
        run: |
          arq=$(ls atlas/_site/*.pdf | head -n 1)
          nome="atlas-rio-paranaiba-${{ steps.alvo.outputs.pasta }}.pdf"
          cp "$arq" "atlas/_site/$nome"
          echo "nome=$nome" >> "$GITHUB_OUTPUT"

      - name: Publicar como versão principal
        if: steps.alvo.outputs.destino == 'principal' || github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ATLAS_CHAVE_PUBLICACAO }}
          external_repository: youthmappers-ufv/atlas
          publish_branch: gh-pages
          publish_dir: atlas/_site
          keep_files: true             # preserva /edicoes/
          commit_message: "Atlas ${{ steps.alvo.outputs.ref }}"

      - name: Publicar como edição numerada
        if: steps.alvo.outputs.destino == 'edicao'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ATLAS_CHAVE_PUBLICACAO }}
          external_repository: youthmappers-ufv/atlas
          publish_branch: gh-pages
          publish_dir: atlas/_site
          destination_dir: edicoes/${{ steps.alvo.outputs.pasta }}
          keep_files: true
          commit_message: "Edição ${{ steps.alvo.outputs.ref }}"

      - name: Release com o PDF (só em tags)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" "atlas/_site/${{ steps.pdf.outputs.nome }}" \
            --title "Atlas ${{ github.ref_name }}" --notes-file atlas/_gerado/edicao.md

      - name: Guardar site e PDF como artefato
        uses: actions/upload-artifact@v4
        with:
          name: atlas-${{ github.run_number }}
          path: atlas/_site
          retention-days: 30
