# Livro do atlas: a mesma fonte gera o site (HTML) e o PDF.
# Antes de renderizar: python scripts/construir.py (gera _gerado/, incluído pelas pranchas).
# A lista de pranchas abaixo deve bater com temas.toml (scripts/validar.py confere):
# entram as que não estão "planejado".
project:
  type: book
  output-dir: _site
  resources:
    - _gerado/downloads/

lang: pt-BR

book:
  title: "Atlas Colaborativo de Rio Paranaíba"
  subtitle: "Mapas abertos do município, a partir do OpenStreetMap"
  author: "Programa Youthmappers UFV"
  publisher: "Universidade Federal de Viçosa — Campus Rio Paranaíba"
  site-url: https://youthmappers-ufv.github.io/atlas/
  output-file: atlas-rio-paranaiba     # nome do PDF, sem acento (vai para URLs)
  downloads: [pdf]
  search: true
  page-footer:
    center: "Dados © colaboradores do OpenStreetMap (ODbL) · Programa Youthmappers UFV · RAEX PRJ-211/2026"
  chapters:
    - index.qmd
    - metodo.qmd
    - part: "Pranchas"
      chapters:
        - pranchas/01-localizacao.qmd
        - pranchas/03-educacao.qmd
    - dados.qmd

format:
  html:
    theme: [cosmo, estilo.scss]
    toc: true
    number-sections: false
  pdf:
    documentclass: scrreprt
    papersize: a4
    pdf-engine: xelatex
    number-sections: false
    toc: true
    fig-pos: "H"
    geometry:
      - top=2.5cm
      - bottom=2.5cm
      - left=2.5cm
      - right=2.5cm
